name: Release Videos

on:
  release:
    types:
      - published

jobs:
  # -----------------------------------------------------------------------
  # One parallel job per simulator scenario.  Each job generates a single
  # MP4 and uploads it as a workflow artifact so the publish job can
  # collect and attach all files to the release in one step.
  #
  # Wall-clock ≈ max(matrix) ≈ city.  Release mode uses the reduced-budget
  # city preview map + --fast-record (skip tree-reveal pacing).
  # -----------------------------------------------------------------------
  generate-video:
    name: Generate ${{ matrix.scenario }} video
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario: [city, ppp, rrp, occ]
      fail-fast: false

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg xvfb libgl1 libglib2.0-0

      # pip install now builds the Rust extension through maturin, so the
      # pinned toolchain has to exist before it runs.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install package with simulator dependencies
        run: pip install -e ".[tools,pygame]"

      - name: Generate video
        # 45 s at 30 fps × 0.1 s sim steps = 135 simulated seconds — enough
        # for every racer (A* needs ~115 s on its windy grid route) to
        # reach the goal on camera.  --fast-record skips tree-reveal
        # pacing so all frames are race/tracking (MPC-heavy).
        run: |
          bash scripts/generate_videos.sh \
            --release \
            --only ${{ matrix.scenario }} \
            --out-dir /tmp/sim_videos \
            --duration 45

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.scenario }}
          path: /tmp/sim_videos/arcosim_${{ matrix.scenario }}.mp4
          retention-days: 1

  # -----------------------------------------------------------------------
  # Collect all per-scenario artifacts and attach them to the release.
  # -----------------------------------------------------------------------
  publish:
    name: Publish videos to release
    needs: generate-video
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all video artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/sim_videos
          pattern: video-*
          merge-multiple: true

      - name: Publish videos to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish_release_videos.sh \
            "${{ github.event.release.tag_name }}" \
            /tmp/sim_videos

  # -----------------------------------------------------------------------
  # Quiet web set: one gesture per PNG, no type in the file. Spec in
  # docs/proposals/web-illustrations.md. Runs beside the video jobs.
  # -----------------------------------------------------------------------
  generate-images:
    name: Generate release images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Render web images
        env:
          MPLBACKEND: Agg
        run: |
          bash scripts/generate_release_images.sh \
            --out-dir /tmp/release_images

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: /tmp/release_images/
          retention-days: 1

  publish-images:
    name: Publish images to release
    needs: generate-images
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: release-images
          path: /tmp/release_images

      - name: Publish images to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish_release_images.sh \
            "${{ github.event.release.tag_name }}" \
            /tmp/release_images
