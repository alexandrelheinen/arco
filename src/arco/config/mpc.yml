# Path-following MPC defaults for DubinsPathFollowingMPC.
# Non-SI unit suffixes are not used; all quantities are SI.

horizon:
  step_count: 20
  dt: 0.05

weights:
  contour: 10.0
  heading: 5.0
  progress: 1.0
  # lag / contour_deadzone default to 0 → classic stiff path hugging.
  # City race overrides these to prefer advancing s over minimizing e_lat.
  lag: 0.0
  contour_deadzone: 0.0
  control: 0.1
  obstacle: 50.0
  terminal: 20.0
  slack: 1.0

obstacle_barrier:
  power: 4.0

solver:
  max_iter_count: 50

# Joint-space carrot-tracking MPC (PPP / RRP / N-DOF).
joint_space:
  horizon:
    step_count: 12
    dt: 0.05
  weights:
    tracking: 20.0
    velocity: 0.5
    control: 0.05
    obstacle: 60.0
  obstacle_barrier:
    power: 4.0
  solver:
    max_iter_count: 40

