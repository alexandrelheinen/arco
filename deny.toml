# cargo-deny configuration. Run by scripts/validate.sh and by CI.
# See .guidelines/languages/rs.md for why this is a blocking gate.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Each entry needs a line in docs/decisions.md saying why, and is removed
# the moment an upgrade makes it unnecessary.
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained, not vulnerable. It
    # reaches us only through `argmin`, it is a proc macro that runs at
    # compile time and ships nothing, and no version of `argmin` avoids
    # it. See ADR-016.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# ARCO ships Apache-2.0. These are the licenses a dependency may carry
# without a decision; anything else needs a line in docs/decisions.md.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
