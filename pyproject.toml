[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "arco"
version = "0.5.0"
description = "Algorithms for Robotic Control and Optimization"
authors = [
    { name = "Alexandre Loeblein Heinen" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "matplotlib",
    "graphviz",
    "pydocstyle"
]
# Removed in phase 7 when the LTV reformulation of ADR-002 lands.
# See docs/rust/DEVIATIONS.md entry A-01.
mpc = [
    "casadi>=3.6",
]
tools = [
    "arco",
    "pygame>=2.0.0",
    "PyOpenGL>=3.1.0",
]

[project.scripts]
arcosim = "arco.simulator.__main__:main"

[tool.maturin]
# Mixed layout: the Python package stays under src/arco and the compiled
# extension lands beside it as arco._arco.
python-source = "src"
module-name = "arco._arco"
manifest-path = "crates/arco-py/Cargo.toml"
features = ["pyo3/extension-module"]
include = ["src/arco/config/*.yml"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D104"]  # Ignore module and package docstrings