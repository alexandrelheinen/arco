# Preview / release map for the city race (reduced planner budgets).
# Same world/tracker as city.yml.  Release Videos uses this file via
# ``scripts/generate_videos.sh --release`` while publishing as
# ``arcosim_city.mp4`` (see .github/workflows/release.yml).
scenario: city
planner:
  step_size:
  - 15.0
  - 15.0
  goal_tolerance: 2.0
  collision_check_count: 4
  goal_bias: 0.05
  obstacle_clearance: 8.0
  rrt_max_sample_count: 2500
  sst_max_sample_count: 4000
  astar_max_sample_count: 4000
  witness_radius: 0.5
  enable_pruning: false
world:
  world_width: 600.0
  world_height: 600.0
  mean_edge_length: 120.0
  jitter_sigma: 0.15
  max_edge_factor: 1.7
  road_half_width: 15.0
  obstacle_sampling_spacing: 4.0
  road_dot_spacing: 15.0
  seed: 42
simulator:
  tracker: mpc
  # Match city.yml: half-block horizon + lane-aware progress-first.
  mpc:
    horizon:
      step_count: 72
      dt: 0.05
    weights:
      contour: 8.0
      heading: 4.0
      control: 0.5
      progress: 4.0
      lag: 4.0
      obstacle: 120.0
      contour_deadzone: 2.5
